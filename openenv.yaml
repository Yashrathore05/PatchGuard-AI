spec_version: 1
name: patchguard
version: 2.0.0
description: "PatchGuard AI — Autonomous Software Change Validation Platform. Multi-agent system that scans repositories, plans, generates, tests, reviews, validates, and recommends software changes before pull request creation."
type: space
runtime: fastapi
app: server.app:app
port: 7860
tags:
  - openenv
  - code-review
  - autonomous-validation
  - multi-agent
  - software-engineering
  - pull-request
  - developer-tools
tasks:
  - id: "1"
    description: "Easy: assignment vs comparison bug"
    grader: server.graders.grade_task_1
  - id: "2"
    description: "Medium: truthy string RBAC bug"
    grader: server.graders.grade_task_2
  - id: "3"
    description: "Hard: range(len) antipattern"
    grader: server.graders.grade_task_3
  - id: "4"
    description: "Easy: == None vs is None"
    grader: server.graders.grade_task_4
  - id: "5"
    description: "Medium: MD5 password hashing"
    grader: server.graders.grade_task_5
  - id: "6"
    description: "Hard: resource leak + SQL injection"
    grader: server.graders.grade_task_6
  - id: "7"
    description: "Hard: deceptive PR - description says typo, code has SQL injection"
    grader: server.graders.grade_task_7
  - id: "8"
    description: "Hard: red herring - 3 fake suspicious lines, 1 real bug hidden"
    grader: server.graders.grade_task_8
  - id: "9"
    description: "Hard: multi-file PR - bug in config.py, distraction in auth.py"
    grader: server.graders.grade_task_9
  - id: "10"
    description: "Adversarial: Boolean Logic Trap"
    grader: server.graders.grade_task_10
  - id: "11"
    description: "Adversarial: Mutable Default Argument"
    grader: server.graders.grade_task_11
  - id: "12"
    description: "Adversarial: Shadowed Variable"
    grader: server.graders.grade_task_12
  - id: "13"
    description: "Adversarial: SQL Injection in Refactor"
    grader: server.graders.grade_task_13
  - id: "14"
    description: "Hard: O(n) set to list Regression"
    grader: server.graders.grade_task_14
  - id: "15"
    description: "Adversarial: Silent Exception Swallow"
    grader: server.graders.grade_task_15
  - id: "16"
    description: "Adversarial: Auth Bypass logic"
    grader: server.graders.grade_task_16
  - id: "17"
    description: "Expert: Threading race condition"
    grader: server.graders.grade_task_17
  - id: "18"
    description: "Adversarial: Misleading comment trap"
    grader: server.graders.grade_task_18
  - id: "19"
    description: "Medium: Off-by-one Edge Case"
    grader: server.graders.grade_task_19
